version: '3.8'

services:
  securepay:
    build: .
    container_name: securepay-fraud-detection
    ports:
      - "5000:5000"
    volumes:
      - ./database.db:/app/database.db
      - ./uploads:/app/uploads
      - ./model:/app/model
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      # Email configuration (optional)
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SENDER_EMAIL: ${SENDER_EMAIL:-fraud-alerts@securepay.local}
      SENDER_PASSWORD: ${SENDER_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@securepay.local}
    restart: unless-stopped
    networks:
      - securepay-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  securepay-network:
    driver: bridge
